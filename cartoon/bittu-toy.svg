    <circle cx="508" cy="238" r="24"/>
    <circle cx="110" cy="470" r="21"/>
  </g>
  <!-- wave marks -->
  <g fill="none" stroke="#1F5E32" stroke-width="5" stroke-linecap="round">
    <path d="M540 205 Q552 220 546 240"/>
    <path d="M556 195 Q574 222 562 252"/>
  </g>

  <!-- legs and boots -->
  <g fill="none" stroke-linecap="round">
    <path d="M258 465 L258 580" stroke="#1F5E32" stroke-width="20"/>
    <path d="M258 465 L258 580" stroke="#6FCF73" stroke-width="9"/>
    <path d="M342 465 L342 580" stroke="#1F5E32" stroke-width="20"/>
    <path d="M342 465 L342 580" stroke="#6FCF73" stroke-width="9"/>
  </g>
  <g fill="#FF9F1C" stroke="#7A3E00" stroke-width="6">
    <ellipse cx="250" cy="594" rx="36" ry="18"/>
    <ellipse cx="350" cy="594" rx="36" ry="18"/>
  </g>

  <!-- sprout -->
  <path d="M300 174 C298 152 302 138 300 120" fill="none" stroke="#1F5E32" stroke-width="7" stroke-linecap="round"/>
  <g fill="#3FAE4B" stroke="#1F5E32" stroke-width="6" stroke-linejoin="round">
