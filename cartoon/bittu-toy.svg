  </defs>

  <!-- backdrop -->
  <rect width="600" height="700" rx="28" fill="#FFF6E5"/>
  <ellipse cx="300" cy="614" rx="160" ry="16" fill="#000" opacity="0.12"/>

  <!-- wind-up key (behind body) -->
  <g fill="none" stroke-linecap="round">
    <path d="M185 310 L132 310" stroke="#8A6200" stroke-width="16"/>
    <path d="M185 310 L132 310" stroke="#F2B705" stroke-width="8"/>
    <circle cx="112" cy="290" r="17" stroke="#8A6200" stroke-width="15"/>
    <circle cx="112" cy="330" r="17" stroke="#8A6200" stroke-width="15"/>
    <circle cx="112" cy="290" r="17" stroke="#F2B705" stroke-width="7"/>
    <circle cx="112" cy="330" r="17" stroke="#F2B705" stroke-width="7"/>
  </g>

  <!-- arms (behind body) -->
  <g fill="none" stroke-linecap="round">
    <path d="M430 365 C478 345 500 305 505 262" stroke="#1F5E32" stroke-width="24"/>
    <path d="M430 365 C478 345 500 305 505 262" stroke="#6FCF73" stroke-width="12"/>
    <path d="M170 385 C128 400 108 428 110 458" stroke="#1F5E32" stroke-width="24"/>
    <path d="M170 385 C128 400 108 428 110 458" stroke="#6FCF73" stroke-width="12"/>
  </g>
  <!-- waving mitten hand -->
  <g fill="#6FCF73" stroke="#1F5E32" stroke-width="6">
