  <rect x="205" y="398" width="190" height="60" rx="26" fill="#C9F2B5"/>
  <rect x="180" y="196" width="14" height="70" rx="7" fill="#fff" opacity="0.4"/>

  <!-- belly badge -->
  <circle cx="300" cy="428" r="20" fill="#FFD23F" stroke="#1F5E32" stroke-width="5"/>
  <text x="300" y="437" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="26" fill="#1F5E32">B</text>

  <!-- face -->
  <g fill="#fff" stroke="#1F5E32" stroke-width="6">
    <ellipse cx="240" cy="290" rx="27" ry="36" fill="#2B1A10"/>
    <ellipse cx="360" cy="290" rx="27" ry="36" fill="#2B1A10"/>
  </g>
  <circle cx="249" cy="275" r="10" fill="#fff"/>
  <circle cx="369" cy="275" r="10" fill="#fff"/>
  <circle cx="232" cy="306" r="5" fill="#fff"/>
  <circle cx="352" cy="306" r="5" fill="#fff"/>
  <g fill="none" stroke="#1F5E32" stroke-width="6" stroke-linecap="round">
    <path d="M216 236 Q240 224 262 234"/>
    <path d="M338 234 Q360 224 384 236"/>
  </g>
  <ellipse cx="204" cy="350" rx="17" ry="10" fill="#FF9E8A" opacity="0.85"/>
  <ellipse cx="396" cy="350" rx="17" ry="10" fill="#FF9E8A" opacity="0.85"/>
  <path d="M274 338 Q300 390 326 338 Z" fill="#7A2B2B"/>
  <ellipse cx="300" cy="362" rx="13" ry="8" fill="#FF7F8E" clip-path="url(#mouthClip)"/>
  <path d="M274 338 Q300 390 326 338 Z" fill="none" stroke="#1F5E32" stroke-width="6" stroke-linejoin="round"/>

  <text x="300" y="668" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#1F5E32">Bittu — green toy, concept v1</text>
